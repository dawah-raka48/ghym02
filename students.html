<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>الطلاب - مركز غيم</title></head><body>
<aside class="sidebar"><div class="brand"><div class="cloud">☁</div><div><strong>مركز غيم</strong><span>لضيافة الأطفال</span></div></div><nav><a href="index.html">الرئيسية</a><a class="active" href="students.html">الطلاب</a><a href="payment.html">تسجيل دفعة</a><a href="payments.html">سجل المدفوعات</a><a href="schedule.html">المواعيد القادمة</a><a href="reports.html">التقارير</a><a href="settings.html">الإعدادات</a></nav></aside>
<main><header class="topbar"><button class="menu" onclick="toggleMenu()">☰</button><div><div class="eyebrow">الطلاب</div><h1>إدارة ملفات الطلاب</h1></div></header>
<section class="card"><div class="section-head"><div><small>إضافة وتعديل وحذف</small><h3>الطلاب</h3></div><button class="primary" onclick="openStudent()">＋ إضافة طالب</button></div>
<div class="filters"><input id="studentSearch" placeholder="ابحث باسم الطالب..." oninput="renderStudents()"><select id="levelFilter" onchange="renderStudents()"></select></div>
<div class="table-wrap"><table><thead><tr><th>الطالب</th><th>المستوى</th><th>الرسوم</th><th>المدفوع</th><th>المتبقي</th><th>إجراءات</th></tr></thead><tbody id="studentsTable"></tbody></table></div></section></main>
<div class="modal" id="studentModal"><div class="modal-box"><button class="close" onclick="closeStudent()">×</button><h2 id="studentModalTitle">إضافة طالب</h2><input type="hidden" id="sId"><input id="sName" placeholder="اسم الطالب"><select id="sLevel"></select><input id="sFees" type="number" min="0" placeholder="إجمالي الرسوم"><textarea id="sNotes" placeholder="ملاحظات"></textarea><button class="primary wide" onclick="saveStudent()">حفظ البيانات</button></div></div>
<script src="js/app.js"></script><script>initStudentPage();</script></body></html>
